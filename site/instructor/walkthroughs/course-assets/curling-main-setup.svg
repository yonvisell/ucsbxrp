<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-label="1 · Create the robot and obtain its first state">
<rect width="100%" height="100%" rx="8" fill="#f4f7fb"/>
<text x="22" y="32" fill="#123b5d" font-family="sans-serif" font-size="22" font-weight="bold">1 · Create the robot and obtain its first state</text>
<text x="22" y="56" fill="#455b6b" font-family="sans-serif" font-size="15">main.py · numbered statements from the supplied file</text>
<rect x="18" y="61" width="864" height="28" rx="3" fill="#dfeefa"/>
<text x="26" y="82" fill="#66717b" font-family="monospace" font-size="16">12</text>
<text x="70" y="82" fill="#17334a" font-family="monospace" font-size="16">robot = make_robot(ROBOT_CONFIG)</text>
<rect x="18" y="93" width="864" height="28" rx="3" fill="#dfeefa"/>
<text x="26" y="114" fill="#66717b" font-family="monospace" font-size="16">14</text>
<text x="108.4" y="114" fill="#17334a" font-family="monospace" font-size="16">state = robot.start(INITIAL_POSE)</text>
<rect x="18" y="125" width="864" height="28" rx="3" fill="#dfeefa"/>
<text x="26" y="146" fill="#66717b" font-family="monospace" font-size="16">15</text>
<text x="108.4" y="146" fill="#17334a" font-family="monospace" font-size="16">first = state.measurements</text>
<text x="22" y="196" fill="#263e4b" font-family="sans-serif" font-size="18">make_robot creates the hardware reader and selected component objects.</text>
<text x="22" y="234" fill="#263e4b" font-family="sans-serif" font-size="18">start resets counts, speeds and pose, then returns them in RobotState.</text>
<text x="22" y="272" fill="#263e4b" font-family="sans-serif" font-size="18">first refers to the Measurements record inside that returned state.</text>
</svg>
