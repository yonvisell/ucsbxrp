<svg xmlns="http://www.w3.org/2000/svg" width="760" height="294" viewBox="0 0 760 294" role="img" aria-labelledby="title desc">
<title id="title">Arena Line Circuit: six waypoint crossings</title>
<desc id="desc">Circuit 1, drawn from the active world geometry. The XRP starts facing right with its forward sensors on the start bar. Travel is counterclockwise: count the start as 1, pass waypoints 2 through 5, and stop at the start bar on crossing 6.</desc>
