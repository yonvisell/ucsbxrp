<style>text{font-family:Arial,Helvetica,sans-serif;fill:#17334a}.heading{font-size:27px;font-weight:700}.label{font-size:27px}.small{font-size:24px;fill:#425b6d}.count{font-size:29px;font-weight:700}.track{fill:none;stroke:#20262a;stroke-linejoin:round;stroke-linecap:round}.motion{fill:none;stroke:#0f766e;stroke-width:4;stroke-linecap:round;marker-end:url(#turn-arrow)}.leader{fill:none;stroke:#627b8a;stroke-width:1.5}</style>
