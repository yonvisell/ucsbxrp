<text x="108.4" y="242" fill="#17334a" font-family="monospace" font-size="16">reason = &quot;time_limit&quot;</text>
<text x="22" y="292" fill="#263e4b" font-family="sans-serif" font-size="18">The 120 s deadline uses elapsed sample time from the first measurement.</text>
<text x="22" y="330" fill="#263e4b" font-family="sans-serif" font-size="18">The cutoff keeps this sample’s distance and fixes the reported time at 120 s.</text>
