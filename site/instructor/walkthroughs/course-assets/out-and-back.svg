<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" role="img" aria-labelledby="title desc">
<title id="title">Out-and-Back</title>
<desc id="desc">Known outbound route from home through two waypoints to a stationary gate observation pose. Upper and lower walls, variable center gate, and far reflector are shown. No return route is drawn. Geometry comes from the active world.json.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#0f766e"/></marker></defs>
<style>.background{fill:#fff}.arena{fill:#f8fafc;stroke:#64748b;stroke-width:1.5}.start-box{fill:#dbeafe;fill-opacity:.55;stroke:#155e75;stroke-width:1.5;stroke-dasharray:4 3}.obstacle{fill:#475569;stroke:#334155;stroke-width:1.5}.gate{fill:#f59e0b;fill-opacity:.55;stroke:#92400e;stroke-width:2;stroke-dasharray:5 3}.track{fill:none;stroke:#1f2937;stroke-linejoin:round;stroke-linecap:round}.finish{stroke:#111827;stroke-linecap:round}.outbound{fill:none;stroke:#0f766e;stroke-width:3;stroke-dasharray:7 5;stroke-linejoin:round}.direction{stroke:#0f766e;stroke-width:3;stroke-linecap:round}.point{fill:#155e75;stroke:#fff;stroke-width:2}.goal{fill:#b45309;stroke:#fff;stroke-width:2}.home{fill:#155e75;stroke:#fff;stroke-width:2}.point-text{fill:#fff;font:700 12px system-ui,sans-serif}.label{fill:#0f172a;font:600 13px system-ui,sans-serif;paint-order:stroke;stroke:#fff;stroke-width:3px}.small{fill:#334155;font:12px system-ui,sans-serif}</style>
<rect class="background" width="700" height="330"/>
<rect class="arena" x="50.0" y="45.0" width="600.00" height="240.00"/>
<rect class="obstacle" x="418.9" y="194.53" width="19.68" height="19.68"/>
<rect class="obstacle" x="418.9" y="115.79" width="19.68" height="19.68"/>
<rect class="gate" x="418.9" y="135.47" width="19.68" height="59.06"/>
<rect class="obstacle" x="56.69" y="105.94" width="9.85" height="118.12"/>
<polyline class="outbound" points="109.06,165.0 109.06,243.74 468.11,243.74 468.11,165.0"/>
<circle class="home" cx="109.06" cy="165.0" r="10"/><text class="point-text" x="109.06" y="169.0" text-anchor="middle">H</text>
<circle class="home" cx="109.06" cy="243.74" r="10"/><text class="point-text" x="109.06" y="247.74" text-anchor="middle">1</text>
<circle class="home" cx="468.11" cy="243.74" r="10"/><text class="point-text" x="468.11" y="247.74" text-anchor="middle">2</text>
<circle class="goal" cx="468.11" cy="165.0" r="10"/><text class="point-text" x="468.11" y="169.0" text-anchor="middle">O</text>
<text class="label" x="109.06" y="145.0" text-anchor="middle">Home</text>
<line class="direction" x1="452.11" y1="165.0" x2="420.11" y2="165.0" marker-end="url(#arrow)"/>
<text class="label" x="485.11" y="157.0" text-anchor="start">Observe</text>
<text class="small" x="433" y="109" text-anchor="start">Upper wall</text>
<text class="small" x="433" y="231" text-anchor="start">Lower wall</text>
<text class="label" x="366" y="167" text-anchor="end">Gate</text>
<text class="small" x="76" y="98" text-anchor="start">Far reflector</text>
<text class="small" x="52" y="41" text-anchor="start">+y ↑</text>
<text class="small" x="649" y="301" text-anchor="end">+x →</text>
<text class="small" x="50" y="311" text-anchor="start">Dashed teal: assigned outbound route · Orange: gate may be open or blocked</text>
</svg>
