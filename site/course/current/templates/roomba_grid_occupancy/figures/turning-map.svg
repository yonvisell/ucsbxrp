<svg xmlns="http://www.w3.org/2000/svg" width="550" height="931" viewBox="0 0 460 779" role="img" aria-labelledby="title desc">
  <title id="title">An earlier occupied square affects a later retreat</title>
  <desc id="desc">Two crops from recorded Virtual XRP World at the same scale and floor coordinates. During the first turn a 226 mm range estimate marks cell (22, 13), shown by the four corners. After the turn the sensor estimates 615 mm toward the north wall. The previous square lies to the right of this beam. The dashed boundary encloses the area that the circular chassis footprint would sweep on its next 60 mm advance. That area touches the earlier square.</desc>
  <!-- Recorded RGB pixels from the default Posts and boxes Virtual XRP run, seed 17, 50 mm cells. The brackets, leaders and swept footprint are annotations. The 3.60 s decision pose was (−599.35, 60.41) mm, 47.17 degrees. World renderer SHA256 db3757f1442da51c4bbfb6fcd6a463477588d988b06a3398e6f606e5a0808fdb; measured-map SHA256 c1230e23cfccfb3a9088d7a8382b2f02687c6be8bc4dace4b93a6a94fdacea26. -->
  <style>
    text{font-family:"Helvetica Neue",Arial,sans-serif;fill:#26353c}
    .panel{font-size:20px;font-weight:600} .range{font-size:17px;fill:#47565d}
    .label{font-size:17px} .halo{paint-order:stroke;stroke:white;stroke-width:4px;stroke-linejoin:round}
    .frame{fill:none;stroke:#b8c3c7;stroke-width:1}
    .leader{fill:none;stroke:#536168;stroke-width:1.5;stroke-linejoin:round}
  </style>
  <rect width="460" height="779" fill="white"/>
  <text x="13" y="24" class="panel">During the turn</text>
  <text x="447" y="24" text-anchor="end" class="range">Range estimate 226 mm</text>
  <image x="13" y="34" width="434" height="222.090" href="data:image/webp;base64,"/>
  <rect x="13" y="34" width="434" height="222.090" class="frame"/>
  <defs><path id="bracket-0" d="M232.22 115.78V109.28H238.72 M255.81 109.28H262.31V115.78 M262.31 132.86V139.36H255.81 M238.72 139.36H232.22V132.86" fill="none"/></defs>
  <use href="#bracket-0" stroke="white" stroke-width="4.4"/>
  <use href="#bracket-0" fill="none" style="stroke:#49301c;stroke-width:2.3"/>
  <path class="leader" d="M320.22 91.37H291.54L264.70 107.10"/>
  <text x="331.33" y="82.12" class="label halo" text-anchor="middle">Cell (22, 13)</text>
  <text x="13" y="289.09" class="panel">After the turn</text>
  <text x="447" y="289.09" text-anchor="end" class="range">Range estimate 615 mm</text>
  <image x="13" y="302" width="434" height="467.313" href="data:image/webp;base64,"/>
  <rect x="13" y="302" width="434" height="467.313" class="frame"/>
  <g transform="matrix(1.82880066 0 0 1.82880066 -603.280219 194.100761)">
  <path id="sweep" d="M431.99 274.56 L445.41 260.09 A44.74 44.74 0 0 0 379.79 199.26 L366.37 213.73 A44.74 44.74 0 0 0 431.99 274.56 Z" fill="none"/>
  <use href="#sweep" fill="none" stroke="white" stroke-width="3.2"/>
  <use href="#sweep" fill="none" stroke="#304950" stroke-width="1.7" stroke-dasharray="5.5 3.5"/>
  </g>
  <defs><path id="bracket-1" d="M232.22 629.00V622.50H238.72 M255.81 622.50H262.31V629.00 M262.31 646.09V652.59H255.81 M238.72 652.59H232.22V646.09" fill="none"/></defs>
  <use href="#bracket-1" stroke="white" stroke-width="4.4"/>
  <use href="#bracket-1" fill="none" style="stroke:#49301c;stroke-width:2.3"/>
  <path class="leader" d="M73.15 521.31H85.18L111.09 542.60"/>
  <text x="29.66" y="499.10" class="label halo">Space for the</text>
  <text x="29.66" y="517.61" class="label halo">next 60 mm</text>
</svg>
