<svg xmlns="http://www.w3.org/2000/svg" width="550" height="465" viewBox="0 0 460 389" role="img" aria-labelledby="title desc">
  <title id="title">One range estimate and its possible bearings</title>
  <desc id="desc">North is up and east is right. World shows the XRP turning southeast. A dark dot marks the axle midpoint. The white sensor-origin circle is 70 mm ahead, along the heading, 55 degrees clockwise from positive x. The sensor gives a 198 mm range estimate. The gold arc joins the possible reflecting points within 7.5 degrees on each side of the centerline. The black endpoint is the point selected by the centerline assumption.</desc>
  <!-- Default Posts and boxes, completed Virtual XRP, acquisition 18.60 s. Crop starts at column 4, ends before 14; starts at row 3, ends before 12. A 50 mm cell spans 39 units. Robot image rendered from World addRobotModel with its orthographic camera and lighting at this pose. -->
  <style>
    text{font-family:"Helvetica Neue",Arial,sans-serif;fill:#26353c;font-size:18px}
    .math{font-family:Georgia,"Times New Roman",serif;font-style:italic}
    .label{font-weight:500} .detail{fill:#45555c;font-size:16px}
    .axisindex{font-size:16px;fill:#52656b;font-variant-numeric:tabular-nums}
    .ink{fill:none;stroke:#304650;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
    .leader{fill:none;stroke:#53666e;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
    .halo{paint-order:stroke;stroke:white;stroke-width:4.5;stroke-linejoin:round}
    .order{fill:#233d4b;font-weight:650;font-size:17px;paint-order:stroke;stroke:white;stroke-width:3.5;stroke-linejoin:round}
    .grid{fill:none;stroke:#c6cfd1;stroke-width:1.15}
  </style>
