  <title id="title">The same observation updates two previously unknown cells</title>
  <desc id="desc">The recorded map after this observation uses the World colors. Four crossed squares were already observed free. Cell (10, 5) changes from unknown to observed free. The range endpoint changes (10, 4) from unknown to occupied. The square immediately beyond it, (10, 3), stays unknown. Other visible blue and orange squares retain evidence from earlier observations.</desc>
