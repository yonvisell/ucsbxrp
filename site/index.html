    <noscript>
      <style>
        .landing-body .landing-offline-readiness,
        .landing-body #landing-browser-support,
        .landing-body .landing-release {
          display: none;
        }
      </style>
    </noscript>
    <script type="module" crossorigin src="/ucsbxrp/assets/home-D12SSgZr.js"></script>
    <link rel="modulepreload" crossorigin href="/ucsbxrp/assets/project_catalog-DdBMrceQ.js">
    <link rel="modulepreload" crossorigin href="/ucsbxrp/assets/src-DpsLDr_l.js">

    <link rel="stylesheet" crossorigin href="/ucsbxrp/assets/theme-DG3C7C7h.css">
  </head>
  <body class="landing-body">
    <header class="app-header course-header landing-header">
      <a class="brand course-brand" href="./" aria-label="UCSBXRP home">
        <span class="brand-mark">UCSB</span><span class="brand-xrp">XRP</span>
      </a>
      <nav aria-label="Course applications" class="app-navigation">
        <a aria-current="page" class="app-navigation-link" href="./">Home</a>
        <a
          class="app-navigation-link app-navigation-workspace-start"
          href="./workspace/?mode=ide"
          >IDE</a
        >
        <a
          class="app-navigation-link app-navigation-workspace-end"
          href="./workspace/?mode=monitor"
          >Monitor</a
        >
        <a class="app-navigation-link" href="./guide/">Guide</a>
        <a class="app-navigation-link" href="./commission/?mode=install"
          >First robot setup</a
        >
        <a class="app-navigation-link" href="./commission/?mode=wifi"
          >Wi-Fi setup</a
        >
        <a class="app-navigation-link" href="./reference/">API</a>
      </nav>
    </header>
    <main class="landing-shell">
      <h1>Program and explore the XRP robot</h1>
      <p class="landing-introduction">
        Open the <strong>IDE</strong> to begin.
      </p>
      <div
        aria-live="polite"
        class="landing-offline-readiness offline-readiness installing"
        data-testid="offline-readiness"
        id="landing-offline-readiness"
        role="status"
      >
        <span aria-hidden="true" class="offline-readiness-dot"></span>
        <a
          class="offline-readiness-label"
          href="./guide/#offline-use"
          id="landing-offline-readiness-label"
          >Preparing offline copy</a
        >
      </div>
      <p
        aria-live="polite"
        class="landing-browser-support"
        id="landing-browser-support"
        role="status"
        hidden
      >
        Checking browser support…
      </p>
      <noscript>
        <p class="landing-browser-support" data-testid="javascript-required">
          Enable JavaScript for this site in Chrome or Edge, then reload this
          page. The course apps and offline preparation require JavaScript.
        </p>
      </noscript>
      <nav class="landing-instructor-links" aria-label="Instructor resources">
        <div id="home-instructor-access"></div>
      </nav>
    </main>
    <footer class="landing-release" aria-label="Current UCSBXRP release">
      Release <span id="landing-release-id"></span> ·
      <span id="landing-release-date"></span>
    </footer>
