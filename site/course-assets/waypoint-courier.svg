<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" role="img" aria-labelledby="title desc">
<title id="title">Waypoint Courier: return to the starting pose</title>
<desc id="desc">Five ordered navigation goals in world space. Goal 5 is the marked starting position with heading zero. Goal 3 requires heading pi.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#0f766e"/></marker></defs>
<style>.background{fill:#fff}.arena{fill:#f8fafc;stroke:#64748b;stroke-width:1.5}.start-box{fill:#dbeafe;fill-opacity:.55;stroke:#155e75;stroke-width:1.5;stroke-dasharray:4 3}.obstacle{fill:#475569;stroke:#334155;stroke-width:1.5}.gate{fill:#f59e0b;fill-opacity:.55;stroke:#92400e;stroke-width:2;stroke-dasharray:5 3}.track{fill:none;stroke:#1f2937;stroke-linejoin:round;stroke-linecap:round}.finish{stroke:#111827;stroke-linecap:round}.outbound{fill:none;stroke:#0f766e;stroke-width:3;stroke-dasharray:7 5;stroke-linejoin:round}.direction{stroke:#0f766e;stroke-width:3;stroke-linecap:round}.point{fill:#155e75;stroke:#fff;stroke-width:2}.goal{fill:#b45309;stroke:#fff;stroke-width:2}.home{fill:#155e75;stroke:#fff;stroke-width:2}.point-text{fill:#fff;font:700 12px system-ui,sans-serif}.label{fill:#0f172a;font:600 13px system-ui,sans-serif;paint-order:stroke;stroke:#fff;stroke-width:3px}.small{fill:#334155;font:12px system-ui,sans-serif}</style>
<rect class="background" width="700" height="330"/>
<rect class="arena" x="50.0" y="45.0" width="600.00" height="240.00"/>
<rect class="start-box" x="93.31" y="149.25" width="31.49" height="31.50"/>
<circle class="home" cx="109.06" cy="165.0" r="10"/><text class="point-text" x="109.06" y="169.0" text-anchor="middle">5</text>
<line class="direction" x1="126.06" y1="165.0" x2="169.06" y2="165.0" marker-end="url(#arrow)"/>
<text class="label" x="79.06" y="141.0" text-anchor="start">S / goal 5</text>
<text class="small" x="79.06" y="196.0" text-anchor="start">(−1224, 0), θ = 0</text>
<circle class="goal" cx="428.74" cy="208.31" r="10"/><text class="point-text" x="428.74" y="212.31" text-anchor="middle">1</text>
<text class="small" x="444.74" y="228.31" text-anchor="start">(400, -220)</text>
<circle class="goal" cx="511.42" cy="111.85" r="10"/><text class="point-text" x="511.42" y="115.85" text-anchor="middle">2</text>
<text class="small" x="527.4200000000001" y="131.85" text-anchor="start">(820, 270)</text>
<circle class="goal" cx="320.47" cy="100.04" r="10"/><text class="point-text" x="320.47" y="104.04" text-anchor="middle">3</text>
<text class="small" x="336.47" y="82.04" text-anchor="start">(-150, 330)</text>
<line class="direction" x1="304.47" y1="100.04" x2="262.47" y2="100.04" marker-end="url(#arrow)"/>
<text class="small" x="298.47" y="80.04" text-anchor="middle">θ = π</text>
<circle class="goal" cx="235.83" cy="216.18" r="10"/><text class="point-text" x="235.83" y="220.18" text-anchor="middle">4</text>
<text class="small" x="251.83" y="236.18" text-anchor="start">(-580, -260)</text>
<line class="direction" x1="350.0" y1="165.0" x2="390.0" y2="165.0" marker-end="url(#arrow)"/>
<line class="direction" x1="350.0" y1="165.0" x2="350.0" y2="125.0" marker-end="url(#arrow)"/>
<text class="small" x="393.0" y="169.0" text-anchor="start">+x</text>
<text class="small" x="340.0" y="119.0" text-anchor="start">+y</text>
<text class="small" x="343.0" y="185.0" text-anchor="end">(0, 0)</text>
<text class="small" x="52" y="41" text-anchor="start">+y ↑</text>
<text class="small" x="649" y="301" text-anchor="end">+x →</text>
<text class="small" x="50" y="311" text-anchor="start">Visit 1 → 2 → 3 → 4 → 5. Positions in mm; headings in rad.</text>
</svg>
